name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    name: catalog.json khop bucket/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/catalog.py --check

  cai-thu:
    name: Cai thu that moi goi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cai Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path 'scoop\shims' | Out-File -Append $env:GITHUB_PATH
      - name: Kiem checkver va cai thu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          $bin = "$HOME\scoop\apps\scoop\current\bin"
          & "$bin\checkver.ps1" -Dir bucket
          foreach ($m in Get-ChildItem bucket\*.json) {
            Write-Host "== $($m.BaseName)"
            scoop install $m.FullName
            if ($LASTEXITCODE) { throw "cai $($m.BaseName) that bai" }
            scoop uninstall $m.BaseName
          }
