name: excavator
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: excavator
jobs:
  cap-nhat:
    name: Cap nhat manifest theo Release moi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cai Scoop
        shell: pwsh
        run: iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
      - name: checkver -Update, cai thu, day len main
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          & "$HOME\scoop\apps\scoop\current\bin\checkver.ps1" -Dir bucket -Update
          $doi = git status --porcelain bucket
          if (-not $doi) { Write-Host 'Khong co ban moi'; exit 0 }
          foreach ($dong in $doi) {
            $tep = ($dong -split '\s+')[-1]
            scoop install (Resolve-Path $tep).Path
            if ($LASTEXITCODE) { throw "cai thu $tep that bai - khong day len" }
            scoop uninstall ([IO.Path]::GetFileNameWithoutExtension($tep))
          }
          git config user.name 'tsudev-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket
          git commit -m "chore(bucket): cap nhat theo Release moi"
          git push
