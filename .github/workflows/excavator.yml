name: excavator
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
# GITHUB_TOKEN chỉ đọc: đẩy lên main bằng deploy key BOT_DEPLOY_KEY (environment `bot`) ở bước checkout.
permissions:
  contents: read
concurrency: excavator
jobs:
  cap-nhat:
    name: Cap nhat manifest theo Release moi
    runs-on: windows-latest
    # Đẩy lên main bằng deploy key (secret BOT_DEPLOY_KEY của environment `bot`, CHỈ nhánh main dùng được) -
    # ngoại lệ DUY NHẤT của required check `Bảo vệ bản quyền` (ruleset bypass actor = DeployKey). Workflow
    # chạy từ nhánh PR không lấy được secret của environment này. Chưa có key ⇒ checkout dùng GITHUB_TOKEN
    # như cũ (giai đoạn chuyển tiếp). Thiết lập: tsudev docs/ban-quyen.md mục 6.
    environment: bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}
      - name: Cai Scoop
        shell: pwsh
        run: iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
      - name: checkver -Update, cai thu, day len main
        shell: pwsh
        env:
          # Scoop đọc token ở SCOOP_GH_TOKEN (không phải GITHUB_TOKEN). Thiếu token thì API GitHub giới hạn 60
          # lượt/giờ cho cả máy chạy dùng chung và checkver trả 403 cho mọi gói.
          SCOOP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          $ra = & "$HOME\scoop\apps\scoop\current\bin\checkver.ps1" -Dir bucket -Update *>&1 | Out-String
          Write-Host $ra
          # 403/giới hạn API KHÔNG được thành "Khong co ban moi": đỏ để người ta thấy.
          if ($ra -match 'rate limit exceeded|\(403\)|is not valid') { throw 'checkver loi API GitHub - khong ket luan duoc' }
          $doi = git status --porcelain bucket
          if (-not $doi) { Write-Host 'Khong co ban moi'; exit 0 }
          foreach ($dong in $doi) {
            $tep = ($dong -split '\s+')[-1]
            scoop install (Resolve-Path $tep).Path
            if ($LASTEXITCODE) { throw "cai thu $tep that bai - khong day len" }
            # Gỡ thử: Windows đôi khi còn khóa lối tắt vừa tạo ("being used by another process") - thử lại, và
            # không làm hỏng lượt cập nhật vì bước CÀI đã chứng minh manifest đúng.
            $ten = [IO.Path]::GetFileNameWithoutExtension($tep)
            foreach ($lan in 1..3) {
              try { scoop uninstall $ten; if (-not $LASTEXITCODE) { break } } catch { Write-Host "go thu lan $lan loi: $_" }
              Start-Sleep -Seconds 5
            }
          }
          git config user.name 'tsudev-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/catalog.py
          if ($LASTEXITCODE) { throw 'sinh catalog.json that bai' }
          git add bucket catalog.json
          git commit -m "chore(bucket): cap nhat theo Release moi"
          git push
