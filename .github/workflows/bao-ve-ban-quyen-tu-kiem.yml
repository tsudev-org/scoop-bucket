name: Tự kiểm cổng bản quyền

# Chạy test đơn vị của cổng khi PR sửa cổng/cấu hình (cổng thật: bao-ve-ban-quyen.yml).
on:
  pull_request:
    paths:
      - 'scripts/bao-ve-ban-quyen*'
      - 'config/ban-quyen.json'

permissions:
  contents: read

jobs:
  tu-kiem:
    name: Tự kiểm cổng bản quyền
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test scripts/bao-ve-ban-quyen.test.mjs
